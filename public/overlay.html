<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoCapi OBS Birthday Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Alerta Principal para OBS -->
  <div id="alert-wrapper" class="alert-wrapper">
    <!-- Globos decorativos animados lado izquierdo -->
    <div class="balloon-cluster left">
      <span class="balloon b1">🎈</span>
      <span class="balloon b2">✨</span>
      <span class="balloon b3">🎈</span>
    </div>

    <div class="alert-card">
      <div class="card-ambient-glow"></div>
      
      <!-- Avatar con Gorrito de Fiesta y Doble Anillo Neón -->
      <div class="alert-avatar-box">
        <div class="alert-party-hat">🥳</div>
        <div class="alert-avatar-ring"></div>
        <div class="alert-avatar-ring-pulse"></div>
        <img id="alert-avatar" src="img/yocapi.png" alt="Avatar" class="alert-avatar-img">
      </div>

      <!-- Detalles del Cumpleañero -->
      <div class="alert-details">
        <div class="alert-tagline-wrap">
          <div class="alert-tagline" id="alert-tagline">
            <span class="tagline-icon">🎂</span>
            <span id="alert-tagline-text">¡HOY ES SU CUMPLEAÑOS!</span>
            <span class="tagline-sparkle">✨</span>
          </div>
        </div>

        <div class="alert-username" id="alert-username">Usuario</div>
        <div class="alert-quote" id="alert-quote" style="display: none;"></div>
        <div class="alert-queue-tag" id="alert-queue-tag" style="display: none;"></div>
      </div>

      <!-- Decoración Animada Cumpleañera -->
      <div class="alert-decor-cluster">
        <div class="decor-popper">🎉</div>
        <div class="decor-stars">🌟</div>
      </div>
    </div>

    <!-- Globos decorativos animados lado derecho -->
    <div class="balloon-cluster right">
      <span class="balloon b4">🎈</span>
      <span class="balloon b5">🎁</span>
      <span class="balloon b6">✨</span>
    </div>
  </div>

  <!-- Estado de conexión (oculto para que nunca salga en directo) -->
  <div id="debug-status" class="obs-debug-status" style="display: none !important;"></div>

  <script src="js/overlay.js"></script>
</body>
</html>
